name: Sync Property Finder listings

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}        # "Run workflow" button for an instant refresh

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull listings from Property Finder
        run: python3 scripts/sync_pf.py
      - name: Check the site still builds
        run: python3 build.py
      - name: Commit if anything changed (Netlify redeploys on push)
        run: |
          git config user.name "listings-bot"
          git config user.email "listings-bot@users.noreply.github.com"
          git add data/listings.json
          if git diff --cached --quiet; then echo "No listing changes."; else git commit -m "Update listings from Property Finder" && git push; fi
